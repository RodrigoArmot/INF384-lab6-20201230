name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Gate 1: Detección de secretos ──────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo para escanear todos los commits del PR

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 2: SCA — análisis de composición de software ─────────────────────
  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias (bloquea en high/critical)
        run: npm audit --audit-level=high

  # ── Gate 3: SAST — análisis estático de código fuente (SonarCloud) ─────────
  sast:
    name: SAST (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # SonarCloud necesita historial completo para blame y new-code

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests y generar cobertura LCOV
        run: npx jest --coverage --coverageReporters=lcov --coverageThreshold='{"global":{"lines":80}}'

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Tests y cobertura ──────────────────────────────────────────────────────
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    needs: [secret-scan, sca, sast]   # no correr si hay secretos, vulns altas o hallazgos SAST
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":80}}'
